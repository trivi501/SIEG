# Sitio de nginx para SIEG (Laravel).
# Instalar en el servidor:
#   sudo cp deploy/nginx/sieg.conf /etc/nginx/sites-available/sieg.conf
#   sudo ln -s /etc/nginx/sites-available/sieg.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d siem.gpe.gob.mx      # HTTPS (agrega el bloque 443 y la redirección)
#
# Ajustar fastcgi_pass a la versión de PHP-FPM instalada (ls /run/php/).

server {
    listen 80;
    listen [::]:80;
    server_name siem.gpe.gob.mx;
    root /var/www/SIEG/public;

    index index.php;
    charset utf-8;

    # Facturas XML de órdenes de compra y otros archivos adjuntos.
    client_max_body_size 20M;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    access_log /var/log/nginx/sieg.access.log;
    error_log  /var/log/nginx/sieg.error.log;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Assets de Vite con hash en el nombre: caché larga.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    error_page 404 /index.php;

    location ~ ^/index\.php(/|$) {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # Ningún otro .php ni archivos ocultos (.env, .git).
    location ~ \.php$ { return 404; }
    location ~ /\.(?!well-known).* { deny all; }
}
